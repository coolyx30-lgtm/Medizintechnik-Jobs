<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn-Netzwerk Mindmap</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#16202b; --ink2:#556270; --line:#dfe3e8; --chip:#eef1f4;
  --root:#12263a; --rootInk:#ffffff; --alu:#ffffff; --leafInk:#1b2530; --badgeInk:#ffffff; --hl:#ffd54f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --panel:#1a2129; --ink:#e7ecf1; --ink2:#9aa7b4; --line:#2c3640; --chip:#232c35;
    --root:#2b4a6b; --leafInk:#e3e9ee; --hl:#8a6d00; --alu:#1a2129;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --panel:#1a2129; --ink:#e7ecf1; --ink2:#9aa7b4; --line:#2c3640; --chip:#232c35;
  --root:#2b4a6b; --leafInk:#e3e9ee; --hl:#8a6d00; --alu:#1a2129;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink2)}
.chip b{color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
input[type=search]{width:240px;max-width:60vw;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button,select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover,select:hover{border-color:var(--ink2)}
main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#stage{position:relative;overflow:hidden;min-height:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;opacity:.9}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px;min-height:0}
aside h2{font-size:16px;margin:0 0 4px}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:18px 0 8px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 6px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;margin:5px 0;cursor:pointer;font-size:13px}
.bar .track{grid-column:1/3;height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar .fill{height:100%;border-radius:3px}
.bar:hover .lbl{text-decoration:underline}
.person{padding:8px 0;border-bottom:1px solid var(--line)}
.person a{color:var(--ink);font-weight:600;text-decoration:none}
.person a:hover{text-decoration:underline}
.person .pos{color:var(--ink2);font-size:12.5px;margin-top:2px}
.person .date{color:var(--ink2);font-size:11.5px;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;color:#fff;margin-right:4px}
.list-item{padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.list-item:hover{color:var(--ink2)}
.back{background:none;border:none;padding:0;color:var(--ink2);cursor:pointer;font-size:12.5px;margin-bottom:8px}
.legend{font-size:12.5px;color:var(--ink2);line-height:1.6}
.info{background:var(--chip);border-radius:10px;padding:10px 12px;margin:10px 0 4px;font-size:13px;line-height:1.5}
.info .sec{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:4px}
.info .prod{margin-top:6px;color:var(--ink2)}
.li-sub{display:block;font-size:11.5px;color:var(--ink2)}
svg text{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.node{cursor:pointer}
.node.dim{opacity:.18}
.edge.dim{opacity:.08}
.node.sel .lab{text-decoration:underline}
@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:1fr 42%}
  aside{border-left:none;border-top:1px solid var(--line)}
  .tools{margin-left:0}
}
body.print header, body.print aside, body.print #hint{display:none}
body.print, body.print #app, body.print main{display:block;height:auto;background:#fff}
body.print #stage{overflow:visible}
</style>

/* Farbschema: Soft Sand #F0E5DB · Mocha Green #474329 · Watermelon Pink #FC75B4 */
:root{--bg:#F0E5DB;--paper:#FBF7F3;--panel:#FBF7F3;--ink:#2B2918;--text:#2B2918;--ink2:#6B6651;--muted:#6B6651;--line:#E0D2C3;--chip:#E9DDD0;--accent:#474329;--accent2:#B83A78;--pink:#FC75B4;--root:#474329;--rootInk:#ffffff;--alu:#FBF7F3;--leafInk:#2B2918;--hl:#FC75B4;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1C1A10;--paper:#28261A;--panel:#28261A;--ink:#F0E5DB;--text:#F0E5DB;--ink2:#B5AB98;--muted:#B5AB98;--line:#3B3827;--chip:#333020;--accent:#D14F90;--accent2:#D14F90;--pink:#FC75B4;--root:#474329;--leafInk:#F0E5DB;--hl:#8C2F5E;--alu:#28261A;}}

::selection{background:#FC75B4;color:#2B2918}
</style>
</head>

</main>
</div>

const LEFT  = ["Mein Profil","Forschungsinstitute","Engineering-Dienstleister","Automotive, Industrie & Technik","Energie & Klima","IT, Beratung & Medien","Finanzen, Start-ups & Sonstiges"];

/* ---------- Baum aufbauen ---------- */
let uid = 0;
function mk(o){ o.id = "n" + (uid++); return o; }
const root = mk({type:"root"});
const branches = [];
if (!DATA.anon) branches.push(mk({type:"cat", profile:true, name:"Mein Profil", color:COLORS["Mein Profil"],
  children: DATA.profile.sections.map(s => mk({type:"group", section:true, name:s.name, color:COLORS["Mein Profil"],
    children: s.items.map(t => mk({type:"item", name:t, color:COLORS["Mein Profil"]}))}))}));
for (const c of DATA.categories){
  const color = COLORS[c.name] || "#777";
  branches.push(mk({type:"cat", name:c.name, count:c.count, acount:c.acount, companies:c.companies, color,
    children: c.children.map(ch => ch.group
      ? mk({type:"group", name:ch.name, count:ch.count, acount:ch.acount, companies:ch.companies, color, cat:c.name,
           children: ch.children.map(x => mk(Object.assign({type:"company", color, cat:c.name, group:ch.name}, x)))})
      : mk(Object.assign({type:"company", color, cat:c.name}, ch)))}));
}
const byName = Object.fromEntries(branches.map(b => [b.name, b]));
const allCompanies = [];
branches.forEach(b => b.children.forEach(ch => {
  if (ch.type === "company") allCompanies.push(ch);
  if (ch.type === "group" && !ch.section) ch.children.forEach(x => allCompanies.push(x));
}));
const nodeById = {};
(function idx(n){ nodeById[n.id] = n; (n.children||[]).forEach(idx); })({id:root.id, children:branches});
nodeById[root.id] = root;

/* ---------- Zustand ---------- */
const state = { min: +(params.get("min") || 1), q: "", sel: null, collapsed: new Set(), src: "all" };
const NOCO = n => /^Ohne Firmenangabe/.test(n.full || "");
function v(n){
  if (n.type === "company") return state.src === "contacts" ? n.count : state.src === "alumni" ? n.acount : n.count + n.acount;
  if (n.type === "group" || n.type === "cat") return (n.children||[]).reduce((a, c) => a + (c.type === "company" || c.type === "group" ? v(c) : 0), 0);
  if (n.type === "more") return n.hidden.reduce((a, c) => a + v(c), 0);
  return 0;
}
function ncomp(n){ return (n.children||[]).reduce((a, c) => a + (c.type === "group" ? ncomp(c) : (c.type === "company" && v(c) > 0 && !NOCO(c) ? 1 : 0)), 0); }
function cntC(n){ return n.type === "company" ? (state.src === "alumni" ? 0 : n.count) : (n.children||[]).reduce((a,c)=>a+(c.type==="company"||c.type==="group"?cntC(c):0),0); }
function cntA(n){ return n.type === "company" ? (state.src === "contacts" ? 0 : n.acount) : (n.children||[]).reduce((a,c)=>a+(c.type==="company"||c.type==="group"?cntA(c):0),0); }
function subLine(n, unit){
  const c = cntC(n), a = cntA(n), k = ncomp(n), parts = [];
  if (state.src !== "alumni") parts.push(`${c} ${c===1?"Kontakt":"Kontakte"}`);
  if (state.src !== "contacts") parts.push(`${a} Alumni`);
  parts.push(`${k} ${unit === "b" ? (k===1?"Bereich":"Bereiche") : (k===1?"Firma":"Firmen")}`);
  return parts.join(" · ");
}
if (PRINT === "compact") { state.min = 2; if (!DATA.anon) branches[0].children.forEach(c => state.collapsed.add(c.id)); }

/* ---------- Textmessung ---------- */
const ctx = document.createElement("canvas").getContext("2d");
const FONT = 'Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function tw(t, size, weight){ ctx.font = `${weight||400} ${size}px ${FONT}`; return ctx.measureText(t).width; }

/* ---------- Layout ---------- */
const ROW = 24, CAT_GAP = 20, GROUP_PAD = 6;
const ROOT_W = 310, ROOT_H = 116;
const S = { cat:15, catSub:11.5, group:13, leaf:12.5, item:12 };

function visibleChildren(n){
  if (!n.children || state.collapsed.has(n.id)) return [];
  if (n.type === "cat" && !n.profile || (n.type === "group" && !n.section)){
    const keep = [], small = [];
    for (const ch of n.children){
      const val = v(ch);
      if (val === 0) continue;
      if (ch.type === "group" || val >= state.min || NOCO(ch)) keep.push(ch); else small.push(ch);
    }
    if (small.length){
      const k = n.id + "_more";
      keep.push(nodeById[k] = { id:k, type:"more", color:n.color, cat:n.cat||n.name,
        name:`+ ${small.length} weitere ${small.length===1?"Firma":"Firmen"} mit je ${state.min===2?"1 Person":"1–2 Personen"}`,
        hidden: small, count: 0, acount: 0 });
    }
    // Gruppen ohne sichtbare Kinder trotzdem zeigen
    return keep;
  }
  return n.children;
}

function nodeSize(n){
  if (n.type === "cat"){
    const sub = n.profile ? "Werdegang & Kompetenzen" : subLine(n, "f");
    n.sub = sub;
    n.w = Math.max(tw(n.name, S.cat, 700), tw(sub, S.catSub, 500)) + 30 + 16; n.h = 44;
  } else if (n.type === "group"){
    n.label = n.section ? n.name : `${n.name}`;
    n.sub = n.section ? "" : subLine(n, "b");
    n.w = Math.max(tw(n.label, S.group, 700), n.sub ? tw(n.sub, 10.5, 500) : 0) + 24 + 14; n.h = n.sub ? 36 : 28;
  } else if (n.type === "item"){
    n.w = tw(n.name, S.item, 400) + 16; n.h = ROW;
  } else {
    const bold = n.type === "company" && v(n) >= 3 && !NOCO(n);
    n.label = n.name + (n.own ? "  ★" : "");
    n.badges = [];
    if (n.type === "company"){
      if (state.src !== "alumni" && n.count > 0) n.badges.push({k:"c", v:n.count});
      if (state.src !== "contacts" && n.acount > 0) n.badges.push({k:"a", v:n.acount});
    } else n.badges.push({k:"m"});
    n.w = tw(n.label, S.leaf, bold ? 650 : 400) + 8 + 20 * n.badges.length; n.h = ROW;
  }
}

let L = null; // Layoutergebnis
function layout(){
  const placed = [], edges = [];
  const sides = [{dir:1, names:RIGHT}, {dir:-1, names:LEFT}];
  // Spalten bestimmen
  const all = branches;
  all.forEach(nodeSize);
  const col1 = ROOT_W/2 + 70;
  const maxCat = Math.max(...all.map(b=>b.w));
  const col2 = col1 + maxCat + 54;
  let maxGroup = 0;
  all.forEach(b => b.children.forEach(ch => { if (ch.type==="group"){ nodeSize(ch); maxGroup = Math.max(maxGroup, ch.w); } }));
  const col3 = col2 + maxGroup + 46;

  root.x = -ROOT_W/2; root.y = 0; root.w = ROOT_W; root.h = ROOT_H; root.dir = 0;
  placed.push(root);

  for (const side of sides){
    let cur = 0; const local = [];
    const cats = side.names.map(n => byName[n]).filter(Boolean);
    cats.forEach((cat, ci) => {
      if (ci) cur += CAT_GAP;
      const kids = visibleChildren(cat);
      const ys = [];
      if (!kids.length){ ys.push(cur + cat.h/2); cur += cat.h; }
      kids.forEach((ch, k) => {
        nodeSize(ch);
        if (ch.type === "group"){
          const gk = visibleChildren(ch);
          if (k) cur += GROUP_PAD;
          if (!gk.length){ ch.cy = cur + Math.max(ch.h, ROW)/2; cur += Math.max(ch.h, ROW) + 2; }
          else {
            const gy = [];
            gk.forEach(x => { nodeSize(x); x.cy = cur + ROW/2; x.col = col3; x.par = ch; x.dir = side.dir; local.push(x); gy.push(x.cy); cur += ROW; });
            ch.cy = (gy[0] + gy[gy.length-1]) / 2;
            cur += GROUP_PAD;
          }
          ch.col = col2; ch.par = cat; ch.dir = side.dir; local.push(ch); ys.push(ch.cy);
        } else {
          ch.cy = cur + ROW/2; ch.col = col2; ch.par = cat; ch.dir = side.dir; local.push(ch); ys.push(ch.cy); cur += ROW;
        }
      });
      cat.cy = (ys[0] + ys[ys.length-1]) / 2; cat.col = col1; cat.par = root; cat.dir = side.dir; local.push(cat);
    });
    const off = -cur/2;
    for (const n of local){
      n.y = n.cy + off;
      n.x = side.dir > 0 ? n.col : -n.col - n.w;  // linke Kante
      placed.push(n);
      edges.push({from:n.par, to:n});
    }
  }
  // Bounding Box
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const n of placed){ x0=Math.min(x0,n.x); x1=Math.max(x1,n.x+n.w); y0=Math.min(y0,n.y-n.h/2); y1=Math.max(y1,n.y+n.h/2); }
  L = {placed, edges, bbox:{x:x0-30, y:y0-30, w:x1-x0+60, h:y1-y0+60}};
}

/* ---------- Zeichnen ---------- */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function tint(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function matches(n){
  if (!state.q) return true;
  const q = state.q;
  const hay = c => v(c) > 0 && ((c.full||c.name||"").toLowerCase().includes(q) || (c.info && (c.info.sector+" "+c.info.desc+" "+c.info.products).toLowerCase().includes(q)) || !DATA.anon && [...(state.src!=="alumni"?c.contacts||[]:[]), ...(state.src!=="contacts"?c.alumni||[]:[])].some(p => (p.n+" "+p.p).toLowerCase().includes(q)));
  if (n.type === "company") return hay(n);
  if (n.type === "more") return n.hidden.some(hay);
  if (n.type === "group") return n.section ? n.children.some(i => i.name.toLowerCase().includes(q)) : (n.name.toLowerCase().includes(q) || n.children.some(hay));
  if (n.type === "cat") return n.name.toLowerCase().includes(q) || n.children.some(matches);
  if (n.type === "item") return n.name.toLowerCase().includes(q);
  return true;
}

function render(){
  layout();
  const E = document.getElementById("edges"), N = document.getElementById("nodes");
  E.innerHTML = ""; N.innerHTML = "";
  for (const e of L.edges){
    const a = e.from, b = e.to, d = b.dir;
    const x1 = a.type === "root" ? (d>0 ? a.x + a.w : a.x) : (d>0 ? a.x + a.w : a.x);
    const y1 = a.y;
    const x2 = d>0 ? b.x : b.x + b.w, y2 = b.y;
    const mx = (x1 + x2) / 2;
    const w = b.type === "cat" ? 3 : b.type === "group" ? 2 : 1.3;
    el("path", {d:`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, fill:"none", stroke:b.color, "stroke-width":w,
      "stroke-opacity": b.type==="cat" ? .85 : .55, class:"edge" + (matches(b)?"":" dim")}, E);
  }
  for (const n of L.placed){
    const g = el("g", {class:"node" + (matches(n)?"":" dim") + (state.sel===n.id?" sel":""), "data-id":n.id}, N);
    if (n.type === "root"){
      el("rect", {x:n.x, y:n.y-n.h/2, width:n.w, height:n.h, rx:16, fill:"var(--root)"}, g);
      const t = (s, dy, size, wt, op) => { const e = el("text", {x:0, y:n.y+dy, "text-anchor":"middle", "font-size":size, "font-weight":wt, fill:"#fff", "fill-opacity":op||1}, g); e.textContent = s; };
      t(DATA.profile.name, -24, 21, 750);
      t(DATA.profile.headline, 0, 12.5, 500, .9);
      t(DATA.profile.location, 18, 11.5, 400, .75);
      t(`${DATA.total} Kontakte · ${DATA.alumni} Alumni · ${DATA.companies} Firmen`, 42, 12.5, 650, .95);
    } else if (n.type === "cat"){
      el("rect", {x:n.x, y:n.y-n.h/2, width:n.w, height:n.h, rx:n.h/2, fill:n.color}, g);
      const cx = n.x + 22;
      const t1 = el("text", {x:cx, y:n.y-3, "font-size":S.cat, "font-weight":700, fill:"#fff", class:"lab"}, g); t1.textContent = n.name;
      const t2 = el("text", {x:cx, y:n.y+13, "font-size":S.catSub, "font-weight":500, fill:"#fff", "fill-opacity":.88}, g); t2.textContent = n.sub;
      // Auf-/Zu-Symbol
      const sx = n.dir>0 ? n.x + n.w - 14 : n.x + n.w - 14;
      const ex = el("text", {x:sx, y:n.y+5, "font-size":14, "font-weight":700, fill:"#fff", "text-anchor":"middle", "fill-opacity":.9}, g);
      ex.textContent = PRINT ? "" : (state.collapsed.has(n.id) ? "+" : "–");
    } else if (n.type === "group"){
      el("rect", {x:n.x, y:n.y-n.h/2, width:n.w, height:n.h, rx:9, fill:tint(n.color,.12), stroke:n.color, "stroke-width":1.4}, g);
      const t1 = el("text", {x:n.x+12, y:n.y + (n.sub ? -2 : 4.5), "font-size":S.group, "font-weight":700, fill:"var(--leafInk)", class:"lab"}, g); t1.textContent = n.label;
      if (n.sub){ const t2 = el("text", {x:n.x+12, y:n.y+12, "font-size":10.5, "font-weight":500, fill:n.color}, g); t2.textContent = n.sub; }
      const ex = el("text", {x:n.x+n.w-11, y:n.y+4.5, "font-size":13, "font-weight":700, fill:n.color, "text-anchor":"middle"}, g);
      ex.textContent = PRINT ? "" : (state.collapsed.has(n.id) ? "+" : "–");
    } else if (n.type === "item"){
      el("circle", {cx: n.dir>0 ? n.x+4 : n.x+n.w-4, cy:n.y, r:3, fill:n.color}, g);
      const t = el("text", {x: n.dir>0 ? n.x+13 : n.x+n.w-13, y:n.y+4.3, "font-size":S.item, fill:"var(--leafInk)", "text-anchor": n.dir>0?"start":"end", class:"lab"}, g);
      t.textContent = n.name;
    } else { // company / more
      const isMore = n.type === "more";
      n.badges.forEach((b, i) => {
        const off = 9 + i * 20, bx = n.dir>0 ? n.x+off : n.x+n.w-off;
        if (b.k === "m"){ el("circle", {cx:bx, cy:n.y, r:8, fill:"none", stroke:n.color, "stroke-width":1.2, "stroke-dasharray":"2 2"}, g); return; }
        const r = b.v >= 10 ? 9.5 : 8.5;
        if (b.k === "c") el("circle", {cx:bx, cy:n.y, r, fill:n.color}, g);
        else el("circle", {cx:bx, cy:n.y, r:r-0.7, fill:"var(--alu)", stroke:n.color, "stroke-width":1.6}, g);
        const c = el("text", {x:bx, y:n.y+3.6, "font-size": b.v>=10?9.5:10.5, "font-weight":700, fill: b.k==="c" ? "#fff" : n.color, "text-anchor":"middle"}, g);
        c.textContent = b.v;
      });
      const tx = 8 + 20 * n.badges.length - 6;
      const t = el("text", {x: n.dir>0 ? n.x+tx : n.x+n.w-tx, y:n.y+4.4, "font-size":S.leaf, "font-weight": !isMore && !NOCO(n) && v(n)>=3 ? 650 : 400,
        fill: isMore ? n.color : "var(--leafInk)", "font-style": isMore ? "italic":"normal", "text-anchor": n.dir>0?"start":"end", class:"lab"}, g);
      t.textContent = isMore ? n.name : n.label;
    }
    // Klickfläche
    el("rect", {x:n.x-4, y:n.y-n.h/2, width:n.w+8, height:n.h, fill:"transparent"}, g);
  }
  if (PRINT) {
    const svg = document.getElementById("map"), b = L.bbox;
    svg.setAttribute("viewBox", `${b.x} ${b.y} ${b.w} ${b.h}`);
    svg.setAttribute("width", b.w); svg.setAttribute("height", b.h);
    svg.style.width = b.w + "px"; svg.style.height = b.h + "px";
    window.__layout = b; window.__ready = true;
  }
}

/* ---------- Pan & Zoom ---------- */
const stage = document.getElementById("stage"), vp = document.getElementById("vp");
let T = {x:0, y:0, k:1};
function apply(){ vp.setAttribute("transform", `translate(${T.x},${T.y}) scale(${T.k})`); }
function fit(){
  if (!L) return; const r = stage.getBoundingClientRect(), b = L.bbox;
  T.k = Math.min(r.width / b.w, r.height / b.h) * 0.98;
  T.x = r.width/2 - (b.x + b.w/2) * T.k; T.y = r.height/2 - (b.y + b.h/2) * T.k; apply();
}
function zoomAt(px, py, f){
  const k = Math.max(0.15, Math.min(4, T.k * f)); f = k / T.k;
  T.x = px - (px - T.x) * f; T.y = py - (py - T.y) * f; T.k = k; apply();
}
if (!PRINT){
  stage.addEventListener("wheel", e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY * 0.0015)); }, {passive:false});
  const ptrs = new Map(); let last = null, moved = 0, pinch = null;
  stage.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, e); stage.setPointerCapture(e.pointerId); last = {x:e.clientX, y:e.clientY}; moved = 0; stage.classList.add("drag");
    if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); } });
  stage.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
    if (ptrs.size === 2 && pinch){ const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); const r = stage.getBoundingClientRect();
      zoomAt((a.clientX+b.clientX)/2 - r.left, (a.clientY+b.clientY)/2 - r.top, d / pinch); pinch = d; moved += 10; return; }
    const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
    T.x += dx; T.y += dy; last = {x:e.clientX, y:e.clientY}; apply(); });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) stage.classList.remove("drag");
    if (moved < 6 && e.type === "pointerup"){ const t = document.elementFromPoint(e.clientX, e.clientY); const g = t && t.closest(".node"); if (g) onNodeClick(nodeById[g.dataset.id]); } };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  window.addEventListener("resize", fit);
}

/* ---------- Interaktion ---------- */
function onNodeClick(n){
  if (!n) return;
  if (n.type === "cat" || n.type === "group"){
    state.collapsed.has(n.id) ? state.collapsed.delete(n.id) : state.collapsed.add(n.id);
  }
  if (n.type === "more"){ state.min = 1; document.getElementById("min").value = "1"; }
  state.sel = n.id; render(); showPanel(n);
}
document.getElementById("expand").onclick = () => { state.collapsed.clear(); render(); fit(); };
document.getElementById("collapse").onclick = () => { branches.forEach(b => state.collapsed.add(b.id)); render(); fit(); };
document.getElementById("fit").onclick = fit;
document.getElementById("src").onchange = e => { state.src = e.target.value; render(); fit(); state.q ? showSearch() : showPanel(null); };
document.getElementById("min").onchange = e => { state.min = +e.target.value; render(); fit(); };
document.getElementById("q").oninput = e => {
  state.q = e.target.value.trim().toLowerCase();
  if (state.q) branches.forEach(b => { if (matches(b)) { state.collapsed.delete(b.id); b.children.forEach(c => c.type==="group" && matches(c) && state.collapsed.delete(c.id)); } });
  if (state.q) { state.min = 1; document.getElementById("min").value = "1"; }
  render(); state.q ? showSearch() : showPanel(null);
};

/* ---------- Seitenleiste ---------- */
const panel = document.getElementById("panel");
const fmtDate = d => d ? new Date(d).toLocaleDateString("de-DE", {month:"short", year:"numeric"}) : "";
function aluHTML(p, showCompany){
  return `<div class="person"><a href="https://www.linkedin.com/search/results/people/?keywords=${encodeURIComponent(p.n)}" target="_blank" rel="noopener">${esc(p.n)}</a>
    ${p.p ? `<div class="pos">${esc(p.p)}</div>` : ""}
    ${showCompany ? `<div class="pos">${esc(showCompany)}</div>` : ""}
    <div class="date">Alumni-Gruppe${p.deg ? ` · Kontakt ${p.deg} Grades` : ""}${p.src === "Profil" ? " · Position laut Profil" : ""}</div></div>`;
}
function personHTML(p, showCompany){
  return `<div class="person"><a href="${esc(p.u)}" target="_blank" rel="noopener">${esc(p.n)}</a>
    ${p.p ? `<div class="pos">${esc(p.p)}</div>` : ""}
    ${showCompany ? `<div class="pos">${esc(showCompany)}</div>` : ""}
    <div class="date">vernetzt seit ${fmtDate(p.d)}${p.alu ? " · auch in der Alumni-Gruppe" : ""}</div></div>`;
}
function bars(items, max, onclick){
  return items.map((it, i) => `<div class="bar" data-i="${i}"><span class="lbl">${esc(it.label)}</span><b>${it.v}</b>
    <div class="track"><div class="fill" style="width:${(it.v/max*100).toFixed(1)}%;background:${it.c}"></div></div></div>`).join("");
}
function wireBars(items){ panel.querySelectorAll(".bar").forEach(b => b.onclick = () => items[+b.dataset.i].go()); }
function goto(n){
  // aufklappen und hinzoomen
  let p = n.par; state.collapsed.delete(n.id);
  [n.cat && byName[n.cat], n.group && L.placed.find(x => x.type==="group" && x.name===n.group)].forEach(x => x && state.collapsed.delete(x.id));
  if (n.type === "company" && v(n) === 0){ state.src = "all"; document.getElementById("src").value = "all"; }
  if (n.type === "company" && v(n) < state.min){ state.min = 1; document.getElementById("min").value = "1"; }
  state.sel = n.id; render();
  const m = L.placed.find(x => x.id === n.id);
  if (m && !PRINT){ const r = stage.getBoundingClientRect(); T.k = Math.max(T.k, 0.9); T.x = r.width/2 - (m.x + m.w/2)*T.k; T.y = r.height/2 - m.y*T.k; apply(); }
  showPanel(n);
}
function showPanel(n){
  if (!n || n.type === "root"){
    const top = [...allCompanies].filter(c => !NOCO(c) && v(c) > 0).sort((a,b) => v(b) - v(a) || a.name.localeCompare(b.name)).slice(0, 15);
    const cats = branches.filter(b => !b.profile && v(b) > 0).sort((a,b) => v(b) - v(a));
    const topItems = top.map(c => ({label:c.name, v:v(c), c:c.color, go:() => goto(c)}));
    const noco = c => c.children.reduce((a, x) => a + (x.type === "company" && NOCO(x) ? v(x) : 0), 0);
    const catItems = cats.map(c => ({label:c.name, v:v(c) - noco(c), c:c.color, go:() => goto(c)})).sort((x, y) => y.v - x.v);
    const srcTxt = state.src === "contacts" ? "Kontakte" : state.src === "alumni" ? "Alumni" : "Personen (Kontakte + Alumni)";
    panel.innerHTML = `<h2>${esc(DATA.profile.name)}</h2><p class="sub">${esc(DATA.profile.headline)} ${DATA.anon ? "" : "·"} ${esc(DATA.profile.location)}</p>
      <p class="sub">LinkedIn-Export vom ${DATA.exported}: <b>${DATA.total} Kontakte</b> in ${DATA.companiesContacts} Unternehmen${DATA.noCompany ? ` (${DATA.noCompany} ohne Firmenangabe)` : ""}.</p>
      <p class="sub">Gruppe „${esc(DATA.alumniGroup)}“ (${DATA.alumniMembers} Mitglieder): <b>${DATA.alumni} weitere Alumni</b> ergänzt, davon ${DATA.alumni - DATA.alumniNoCompany} mit aktueller Firma (aus Profiltitel bzw. Profil, Stand 01.11.2026). ${DATA.alumniDirect} Mitglieder sind schon deine Kontakte und zählen nur einmal.</p>
      <p class="sub">Zusammen <b>${DATA.companies} Unternehmen</b> und Einrichtungen.</p>${DATA.anon ? `<p class="sub"><b>Öffentliche Fassung:</b> nur Firmen und Anzahlen, ohne Namen und Positionen.</p>` : ""}
      <h3>${srcTxt} nach Branche</h3><p class="sub">ohne Personen ohne Firmenangabe</p><div id="b1">${bars(catItems, catItems[0].v)}</div>
      <h3>Top 15 Unternehmen</h3><div id="b2">${bars(topItems, topItems[0].v)}</div>
      <h3>Legende</h3><div class="legend"><b>●</b> Gefüllter Kreis = deine Kontakte (1. Grades)<br><b>○</b> Umrandeter Kreis = Mitglieder der Alumni-Gruppe (2./3. Grades)<br>Fett = ab 3 Personen<br>${DATA.anon ? "" : "★ = eigene Station aus deinem Profil<br>"}Bosch-Bereiche, Uni-Institute, Fraunhofer und Max-Planck sind als Gruppe zusammengefasst.<br>Alumni-Firmen stammen aus dem Profiltitel oder, wo dort keine Firma steht, aus der aktuellen Position im Profil (Stand 01.11.2026). Wer derzeit keine Position angibt, steht unter „Alumni ohne aktuelle Firma“.</div>`;
    const all = [...catItems, ...topItems];
    panel.querySelectorAll(".bar").forEach((b, i) => b.onclick = () => all[i].go());
    return;
  }
  const back = `<button class="back" id="bk">← Übersicht</button>`;
  if (n.type === "company"){
    panel.innerHTML = back + `<span class="tag" style="background:${n.color}">${esc(n.cat)}</span>${n.group?`<span class="tag" style="background:${tint(n.color,.75)}">${esc(n.group)}</span>`:""}
      <h2 style="margin-top:8px">${esc(n.full)}${n.own?" ★":""}</h2><p class="sub">${n.count} ${n.count===1?"Kontakt":"Kontakte"} · ${n.acount} aus der Alumni-Gruppe${n.own?" · eigene Station":""}</p>
      ${n.info ? `<div class="info"><div class="sec">${esc(n.info.sector)}</div>${esc(n.info.desc)}${n.info.products ? `<div class="prod"><b>Beispielprodukte:</b> ${esc(n.info.products)}</div>` : ""}</div>` : ""}
      ${DATA.anon ? `<p class="sub">Öffentliche Fassung: Namen und Positionen sind entfernt, nur die Anzahl ist angegeben.</p>` : ""}
      ${n.count && !DATA.anon ? `<h3>Meine Kontakte</h3>` + n.contacts.map(p => personHTML(p)).join("") : ""}
      ${n.acount && !DATA.anon ? `<h3>Alumni-Gruppe</h3>` + n.alumni.map(p => aluHTML(p)).join("") : ""}`;
  } else if (n.type === "cat" || n.type === "group"){
    if (n.profile || n.section){
      const secs = n.profile ? n.children : [n];
      panel.innerHTML = back + `<h2>${esc(n.name)}</h2>` + secs.map(s => `<h3>${esc(s.name)}</h3>` + s.children.map(i => `<div class="person">${esc(i.name)}</div>`).join("")).join("");
    } else {
      const list = n.type === "cat" ? n.children.flatMap(c => c.type==="group" ? c.children : [c]) : n.children;
      const fl = list.filter(c => v(c) > 0).sort((a,b) => v(b) - v(a) || a.name.localeCompare(b.name));
      list.length = 0; list.push(...fl);
      panel.innerHTML = back + `<span class="tag" style="background:${n.color}">${esc(n.cat||n.name)}</span><h2 style="margin-top:8px">${esc(n.name)}</h2>
        <p class="sub">${subLine(n, n.type==="group"?"b":"f")} · Klick erneut auf den Knoten = auf-/zuklappen</p>` +
        list.map((c, i) => `<div class="list-item" data-i="${i}"><span>${esc(c.name)}${c.own?" ★":""}${c.info ? `<span class="li-sub">${esc(c.info.sector)}</span>` : ""}</span><b>${c.count && state.src!=="alumni" ? c.count : ""}${c.count && c.acount && state.src==="all" ? " + " : ""}${c.acount && state.src!=="contacts" ? `<span style="font-weight:500">${c.acount} A</span>` : ""}</b></div>`).join("");
      panel.querySelectorAll(".list-item").forEach(d => d.onclick = () => goto(list[+d.dataset.i]));
    }
  } else if (n.type === "more"){
    panel.innerHTML = back + `<h2>${esc(n.name)}</h2>` + n.hidden.map((c,i) => `<div class="list-item" data-i="${i}"><span>${esc(c.name)}</span><b>${v(c)}</b></div>`).join("");
    panel.querySelectorAll(".list-item").forEach(d => d.onclick = () => goto(n.hidden[+d.dataset.i]));
  } else if (n.type === "item"){
    showPanel(n.par || null); return;
  }
  const bk = document.getElementById("bk"); if (bk) bk.onclick = () => { state.sel = null; render(); showPanel(null); };
}
function showSearch(){
  if (DATA.anon){
    const q = state.q, list = allCompanies.filter(c => v(c) > 0 && (c.full + " " + c.name + (c.info ? " "+c.info.sector+" "+c.info.desc+" "+c.info.products : "")).toLowerCase().includes(q));
    panel.innerHTML = `<h2>Suche: „${esc(q)}“</h2><p class="sub">${list.length} Firmen</p>` +
      list.map((c, i) => `<div class="list-item" data-i="${i}"><span>${esc(c.name)}${c.info ? `<span class="li-sub">${esc(c.info.sector)}</span>` : ""}</span><b>${v(c)}</b></div>`).join("");
    panel.querySelectorAll(".list-item").forEach(d => d.onclick = () => goto(list[+d.dataset.i]));
    return;
  }
  const q = state.q, hits = [];
  const coHits = allCompanies.filter(c => v(c) > 0 && c.info && (c.info.sector+" "+c.info.desc+" "+c.info.products).toLowerCase().includes(q));
  for (const c of allCompanies){
    const byCo = (c.full + " " + c.name).toLowerCase().includes(q);
    if (state.src !== "alumni") c.contacts.forEach(p => { if (byCo || (p.n + " " + p.p).toLowerCase().includes(q)) hits.push({p, c}); });
    if (state.src !== "contacts") (c.alumni||[]).forEach(p => { if (byCo || (p.n + " " + p.p).toLowerCase().includes(q)) hits.push({p, c, a:true}); });
  }
  panel.innerHTML = `<h2>Suche: „${esc(q)}“</h2>` + (coHits.length ? `<h3>Firmen nach Profil (${coHits.length})</h3>` + coHits.map((c, i) => `<div class="list-item co-hit" data-i="${i}"><span>${esc(c.name)}<span class="li-sub">${esc(c.info.sector)}</span></span><b>${v(c)}</b></div>`).join("") + `<h3>Personen</h3>` : "") + `<p class="sub">${hits.length} ${hits.length===1?"Treffer":"Treffer"}</p>` +
    hits.slice(0, 250).map(h => h.a ? aluHTML(h.p, NOCO(h.c) ? "" : h.c.full) : personHTML(h.p, h.c.full)).join("");
  panel.querySelectorAll(".co-hit").forEach(d => d.onclick = () => goto(coHits[+d.dataset.i]));
}

/* ---------- Start ---------- */
document.getElementById("stats").innerHTML =
  `<span class="chip"><b>${DATA.total}</b> Kontakte</span><span class="chip"><b>${DATA.alumni}</b> Alumni</span><span class="chip"><b>${DATA.companies}</b> Unternehmen</span><span class="chip"><b>${DATA.categories.length}</b> Branchen</span><span class="chip">Stand ${DATA.exported}</span>`;
if (DATA.anon){ document.getElementById("ttl").textContent = "Netzwerk nach Firmen"; document.title = "Netzwerk nach Firmen"; document.getElementById("q").placeholder = "Firma oder Branche suchen …"; document.querySelector("#hint").textContent = "Ziehen = verschieben · Mausrad/Pinch = zoomen · Klick auf Branche = auf-/zuklappen · Klick auf Firma = Details"; }
render(); if (!PRINT){ fit(); showPanel(null); }
</script>
